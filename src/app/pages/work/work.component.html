<section class="bg-background min-h-screen py-12 px-2">
  <h2 class="text-3xl sm:text-4xl font-bold text-center text-primary mb-12">أعمالي</h2>
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 max-w-7xl mx-auto">
    <div *ngFor="let project of project" class="rounded-md sm:rounded-lg md:rounded-xl lg:rounded-2xl overflow-hidden shadow-lg bg-white flex flex-col transition hover:shadow-2xl border border-gray-100">
      <!-- صورة المشروع -->
      <img [src]="project.imageUrl || 'https://placehold.co/600x300/FFFAFF/2660A4?text=Project+Image'" 
           alt="{{ project.name }}"
           class="w-full h-48 object-cover bg-background" />
      <!-- تفاصيل المشروع -->
      <div class="flex flex-col flex-grow p-6">
        <span class="inline-block bg-secondary text-white text-xs font-bold px-3 py-1 rounded-md sm:rounded-lg md:rounded-xl lg:rounded-2xl mb-4 self-start">
          {{ project.type || 'مشروع' }}
        </span>
        <h3 class="text-lg font-bold text-primary mb-1">{{ project.name }}</h3>
        <p class="text-gray-600 text-sm mb-4 flex-grow">{{ project.description }}</p>
        <a [href]="project.github || 'https://github.com/'" target="_blank"
           class="inline-flex items-center justify-center bg-secondary hover:bg-blue-700 text-white font-bold py-2 px-5 rounded-md sm:rounded-lg md:rounded-xl lg:rounded-2xl transition-all duration-200 mt-auto">
          <svg class="w-5 h-5 ml-2" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M12 2C6.48 2 2 6.58 2 12.26c0 4.48 2.87 8.29 6.84 9.64.5.09.68-.22.68-.49 0-.24-.01-.87-.01-1.7-2.78.61-3.37-1.37-3.37-1.37-.46-1.19-1.11-1.5-1.11-1.5-.9-.63.07-.62.07-.62 1 .07 1.53 1.05 1.53 1.05.89 1.55 2.33 1.1 2.9.84.09-.65.35-1.1.63-1.35-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.04 1.03-2.76-.1-.26-.45-1.29.1-2.69 0 0 .84-.28 2.75 1.05a9.43 9.43 0 0 1 2.5-.34c.85.01 1.71.12 2.5.34 1.91-1.33 2.75-1.05 2.75-1.05.55 1.4.2 2.43.1 2.69.64.72 1.03 1.64 1.03 2.76 0 3.94-2.34 4.8-4.57 5.06.36.31.68.93.68 1.88 0 1.36-.01 2.46-.01 2.8 0 .27.18.59.69.49C19.14 20.55 22 16.74 22 12.26 22 6.58 17.52 2 12 2z" />
          </svg>
          عرض الكود
        </a>
      </div>
    </div>
  </div>
</section>
