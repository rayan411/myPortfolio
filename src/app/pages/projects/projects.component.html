<section class="bg-background2 min-h-screen py-16 px-4 sm:px-10">
  <div class="max-w-6xl mx-auto">
    <div class="mb-8">
      <a
        routerLink="/"
        class="inline-flex items-center gap-2 px-4 py-2 rounded-xl border border-secondary text-secondary font-semibold hover:bg-secondary hover:text-white transition duration-300 shadow-sm"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-4 h-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 19l-7-7 7-7"
          />
        </svg>
        Back to Home
      </a>
    </div>

    <!-- Page Title -->
    <h2 class="text-3xl md:text-4xl font-bold text-white mb-12 text-center">
      My Projects
    </h2>

    <div class="space-y-16">
      <!-- Data Projects -->
      <div>
        <h3
          class="text-2xl font-bold text-white mb-8 border-b-2 border-secondary inline-block pb-1"
        >
          Data Projects
        </h3>

        <div class="flex flex-col gap-8">
          <div
            *ngFor="let project of dataProjects"
            class="group relative bg-white/95 border border-gray-100 rounded-2xl shadow-lg flex flex-col md:flex-row items-center p-6 md:p-8 gap-8 transition-transform duration-300 hover:shadow-2xl hover:-translate-y-0.5 overflow-hidden"
          >
            <!-- subtle gradient line on hover -->
            <span
              class="pointer-events-none absolute inset-x-0 bottom-0 h-0.5 bg-gradient-to-r from-secondary/0 via-secondary to-secondary/0 opacity-0 group-hover:opacity-100 transition"
            ></span>

            <!-- Cover -->
            <div
              class="w-full md:w-72 h-44 overflow-hidden rounded-xl shadow-md"
            >
              <div
                *ngIf="imgLoading[project.title]"
                class="w-full h-36 flex items-center justify-center"
              >
                <div
                  class="w-10 h-10 border-4 border-secondary border-t-transparent rounded-full animate-spin"
                ></div>
              </div>

              <!-- الصورة -->
              <img
                [hidden]="imgLoading[project.title]"
                (load)="onImageLoad(project.title)"
                [src]="project.image || 'assets/images/analysisIcon.png'"
                [alt]="project.title + ' screenshot'"
                class="w-full md:w-60 h-36 object-contain mb-4 md:mb-0"
                referrerpolicy="no-referrer"
                onerror="this.src='assets/images/placeholder.png'"
              />
            </div>

            <!-- Content -->
            <div class="flex-1">
              <h4 class="text-2xl font-bold text-secondary mb-2">
                {{ project.title }}
              </h4>
              <p
                class="text-primary/90 mb-4 text-base md:text-lg leading-relaxed"
              >
                {{ project.description }}
              </p>

              <!-- Tech badges -->
              <ul class="flex flex-wrap gap-2 mb-5">
                <li
                  *ngFor="let tech of project.techs"
                  class="text-xs md:text-sm bg-secondary text-white/95 px-3 py-1 rounded-full shadow-sm"
                >
                  {{ tech }}
                </li>
              </ul>

              <!-- Actions -->
              <div class="flex flex-wrap gap-3">
                <a
                  *ngIf="project.github"
                  [href]="project.github"
                  target="_blank"
                  rel="noopener"
                  class="inline-flex items-center gap-2 px-4 py-2 rounded-xl border border-gray-200 hover:border-secondary hover:bg-secondary hover:text-white transition focus:outline-none focus-visible:ring-2 focus-visible:ring-secondary/50"
                  aria-label="Open GitHub repository"
                >
                  <!-- GitHub icon -->
                  <svg
                    viewBox="0 0 24 24"
                    class="w-5 h-5"
                    fill="currentColor"
                    aria-hidden="true"
                  >
                    <path
                      fill-rule="evenodd"
                      clip-rule="evenodd"
                      d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.11.8-.25.8-.56v-2.17c-3.26.71-3.95-1.4-3.95-1.4-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.2 1.77 1.2 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.72-1.55-2.6-.3-5.34-1.3-5.34-5.77 0-1.27.46-2.3 1.2-3.11-.12-.3-.52-1.52.11-3.17 0 0 .98-.31 3.2 1.19a11.03 11.03 0 0 1 5.82 0c2.22-1.5 3.2-1.19 3.2-1.19.63 1.65.23 2.87.11 3.17.75.81 1.2 1.84 1.2 3.11 0 4.48-2.74 5.46-5.36 5.76.41.35.77 1.03.77 2.08v3.08c0 .31.21.68.81.56A11.5 11.5 0 0 0 12 .5Z"
                    />
                  </svg>
                  <span class="font-semibold">View Repo</span>
                </a>

                <a
                  *ngIf="project.demo"
                  [href]="project.demo"
                  target="_blank"
                  rel="noopener"
                  class="inline-flex items-center gap-2 px-4 py-2 rounded-xl border border-gray-200 hover:border-secondary hover:bg-secondary hover:text-white transition focus:outline-none focus-visible:ring-2 focus-visible:ring-secondary/50"
                >
                  <span class="font-semibold">Live Demo</span>
                  <span aria-hidden="true">↗</span>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Software Projects -->
      <div>
        <h3
          class="text-2xl font-bold text-white mb-8 border-b-2 border-secondary inline-block pb-1"
        >
          Software Projects
        </h3>

        <div class="flex flex-col gap-8">
          <div
            *ngFor="let project of softwareProjects"
            class="group relative bg-white/95 border border-gray-100 rounded-2xl shadow-lg flex flex-col md:flex-row items-center p-6 md:p-8 gap-8 transition-transform duration-300 hover:shadow-2xl hover:-translate-y-0.5 overflow-hidden"
          >
            <span
              class="pointer-events-none absolute inset-x-0 bottom-0 h-0.5 bg-gradient-to-r from-secondary/0 via-secondary to-secondary/0 opacity-0 group-hover:opacity-100 transition"
            ></span>

            <div
              class="w-full md:w-72 h-44 overflow-hidden rounded-xl shadow-md"
            >
              <div
                *ngIf="imgLoading[project.title]"
                class="w-full h-36 flex items-center justify-center"
              >
                <div
                  class="w-10 h-10 border-4 border-secondary border-t-transparent rounded-full animate-spin"
                ></div>
              </div>

              <!-- الصورة -->
              <img
                [hidden]="imgLoading[project.title]"
                (load)="onImageLoad(project.title)"
                [src]="project.image || 'assets/images/code-des.png'"
                [alt]="project.title + ' screenshot'"
                class="w-full md:w-60 h-36 object-contain mb-4 md:mb-0"
                referrerpolicy="no-referrer"
                onerror="this.src='assets/images/placeholder.png'"
              />
            </div>

            <div class="flex-1">
              <h4 class="text-2xl font-bold text-secondary mb-2">
                {{ project.title }}
              </h4>
              <p
                class="text-primary/90 mb-4 text-base md:text-lg leading-relaxed"
              >
                {{ project.description }}
              </p>

              <ul class="flex flex-wrap gap-2 mb-5">
                <li
                  *ngFor="let tech of project.techs"
                  class="text-xs md:text-sm bg-secondary text-white/95 px-3 py-1 rounded-full shadow-sm"
                >
                  {{ tech }}
                </li>
              </ul>

              <div class="flex flex-wrap gap-3">
                <a
                  *ngIf="project.github"
                  [href]="project.github"
                  target="_blank"
                  rel="noopener"
                  class="inline-flex items-center gap-2 px-4 py-2 rounded-xl border border-gray-200 hover:border-secondary hover:bg-secondary hover:text-white transition focus:outline-none focus-visible:ring-2 focus-visible:ring-secondary/50"
                  aria-label="Open GitHub repository"
                >
                  <svg
                    viewBox="0 0 24 24"
                    class="w-5 h-5"
                    fill="currentColor"
                    aria-hidden="true"
                  >
                    <path
                      fill-rule="evenodd"
                      clip-rule="evenodd"
                      d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.11.8-.25.8-.56v-2.17c-3.26.71-3.95-1.4-3.95-1.4-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.2 1.77 1.2 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.72-1.55-2.6-.3-5.34-1.3-5.34-5.77 0-1.27.46-2.3 1.2-3.11-.12-.3-.52-1.52.11-3.17 0 0 .98-.31 3.2 1.19a11.03 11.03 0 0 1 5.82 0c2.22-1.5 3.2-1.19 3.2-1.19.63 1.65.23 2.87.11 3.17.75.81 1.2 1.84 1.2 3.11 0 4.48-2.74 5.46-5.36 5.76.41.35.77 1.03.77 2.08v3.08c0 .31.21.68.81.56A11.5 11.5 0 0 0 12 .5Z"
                    />
                  </svg>
                  <span class="font-semibold">View Repo</span>
                </a>

                <a
                  *ngIf="project.demo"
                  [href]="project.demo"
                  target="_blank"
                  rel="noopener"
                  class="inline-flex items-center gap-2 px-4 py-2 rounded-xl border border-gray-200 hover:border-secondary hover:bg-secondary hover:text-white transition focus:outline-none focus-visible:ring-2 focus-visible:ring-secondary/50"
                >
                  <span class="font-semibold">Live Demo</span>
                  <span aria-hidden="true">↗</span>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
