<section class="bg-background2 min-h-screen py-16 px-4 sm:px-10">
  <div class="max-w-6xl mx-auto">
    <h2 class="text-3xl md:text-4xl font-bold text-white mb-12 text-center">My Projects</h2>
    <div class="flex flex-col gap-8">
      <div *ngFor="let project of projects" class="bg-white rounded-2xl shadow-lg flex flex-col md:flex-row items-center p-6 md:p-10 gap-8 hover:scale-[1.02] transition">
        <img [src]="project.image" [alt]="project.title + ' screenshot'" class="w-full md:w-64 h-40 object-cover rounded-xl shadow-md mb-4 md:mb-0">
        <div class="flex-1">
          <h3 class="text-2xl font-bold text-secondary mb-2">{{project.title}}</h3>
          <p class="text-primary mb-4 text-base md:text-lg">{{project.description}}</p>
          <div class="flex flex-wrap gap-2 mb-4">
            <span *ngFor="let tech of project.techs" class="bg-secondary/90 text-white px-3 py-1 rounded-full text-xs md:text-sm font-medium shadow">{{tech}}</span>
          </div>
          <div class="flex gap-4">
            <a *ngIf="project.github" [href]="project.github" target="_blank" rel="noopener" class="underline text-secondary font-bold hover:text-white">
              GitHub
            </a>
            <a *ngIf="project.demo" [href]="project.demo" target="_blank" rel="noopener" class="underline text-secondary font-bold hover:text-white">
              Live Demo
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
