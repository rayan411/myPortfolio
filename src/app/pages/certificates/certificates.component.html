<section class="bg-background2 min-h-screen py-16 px-4 sm:px-10">
  <div class="max-w-5xl mx-auto">
    <h2 class="text-3xl md:text-4xl font-bold text-white mb-12 text-center">Certificates & Achievements</h2>
    <div class="grid md:grid-cols-2 gap-8">
      <div *ngFor="let cert of certificates" class="bg-white/10 rounded-2xl shadow-lg flex flex-col md:flex-row items-center p-6 md:p-8 gap-6 hover:scale-[1.02] transition">
        <img [src]="cert.image" [alt]="cert.title" class="w-28 h-28 object-cover rounded-xl shadow-md mb-4 md:mb-0">
        <div class="flex-1">
          <h3 class="text-xl font-bold text-secondary mb-2">{{cert.title}}</h3>
          <p class="text-gray-200 mb-2">{{cert.issuer}}</p>
          <p class="text-xs text-gray-400 mb-2">{{cert.date}}</p>
          <p *ngIf="cert.description" class="text-primary text-sm mb-2">{{cert.description}}</p>
          <div>
            <a *ngIf="cert.url" [href]="cert.url" target="_blank" rel="noopener" class="underline text-secondary font-bold hover:text-white text-xs">Verify</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
