<header class="bg-white/95 shadow-md fixed top-0 left-0 w-full z-30 backdrop-blur">
  <div class="flex justify-between items-center px-4 sm:px-8 py-3 max-w-7xl mx-auto w-full">
    <!-- Logo (left) -->
    <div class="text-2xl font-bold text-secondary tracking-tight">
      <a href="#home" class="hover:opacity-80 transition-all">Rayan</a>
    </div>
    
    <!-- Navbar (right, desktop only) -->
    <nav class="hidden md:flex items-center gap-8 text-lg font-medium">
      <a 
        href="#home"
        [ngClass]="{'text-secondary': isActive('home'), 'text-gray-700': !isActive('home')}"
        class="hover:text-secondary transition"
        (click)="closeMenu()"
      >Home</a>
      <a 
        href="#work"
        [ngClass]="{'text-secondary': isActive('work'), 'text-gray-700': !isActive('work')}"
        class="hover:text-secondary transition"
        (click)="closeMenu()"
      >Work</a>
    
      <a 
        href="#contact"
        [ngClass]="{'text-secondary': isActive('contact'), 'text-gray-700': !isActive('contact')}"
        class="hover:text-secondary transition"
        (click)="closeMenu()"
      >Contact</a>
    </nav>
    
    <!-- Hamburger menu (mobile only) -->
    <div class="md:hidden">
      <button (click)="isMenuOpen = !isMenuOpen" class="text-secondary hover:text-primary focus:outline-none transition">
        <svg *ngIf="!isMenuOpen" xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <svg *ngIf="isMenuOpen" xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile menu -->
  <div *ngIf="isMenuOpen" class="md:hidden items-center justify-center bg-white px-6 py-4 border-b shadow animate-fade-in-down rounded-b-xl space-y-2">
    <a 
      href="#home"
      (click)="closeMenu()" 
      [ngClass]="{'text-secondary': isActive('home'), 'text-gray-700': !isActive('home')}"
      class="block text-lg font-medium hover:text-secondary transition"
    >Home</a>
    <a 
      href="#work"
      (click)="closeMenu()" 
      [ngClass]="{'text-secondary': isActive('work'), 'text-gray-700': !isActive('work')}"
      class="block text-lg font-medium hover:text-secondary transition"
    >Work</a>

    <a 
      href="#contact"
      (click)="closeMenu()" 
      [ngClass]="{'text-secondary': isActive('contact'), 'text-gray-700': !isActive('contact')}"
      class="block text-lg font-medium hover:text-secondary transition"
    >Contact</a>
  </div>
</header>
