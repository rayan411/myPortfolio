<header class="bg-white/95 shadow-md fixed top-0 left-0 w-full z-30 backdrop-blur">
  <div class="flex justify-between items-center px-4 sm:px-8 py-3 max-w-7xl mx-auto w-full">
    <!-- Logo (left) -->
    <div class="text-2xl font-bold text-secondary tracking-tight">
      <a href="#home" class="hover:opacity-80 transition-all">Rayan</a>
    </div>
    
    <!-- Navbar (right, desktop only) -->
    <nav class="hidden md:flex items-center gap-8 text-lg font-medium">
      <a [class.text-secondary]="isActive('home')" href="#home" class="text-gray-700 hover:text-secondary transition">Home</a>
      <a [class.text-secondary]="isActive('work')" href="#work" class="text-gray-700 hover:text-secondary transition">Work</a>
      <a [class.text-secondary]="isActive('contact')" href="#contact" class="text-gray-700 hover:text-secondary transition">Contact</a>
    </nav>
    
    <!-- Hamburger menu (mobile only) -->
    <div class="md:hidden ">
      <button (click)="isMenuOpen = !isMenuOpen" class="text-secondary hover:text-primary focus:outline-none transition">
        <svg *ngIf="!isMenuOpen" xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <svg *ngIf="isMenuOpen" xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile menu -->
  <div *ngIf="isMenuOpen" class="md:hidden items-center  justify-center bg-white px-6 py-4 border-b shadow animate-fade-in-down rounded-b-xl space-y-2">
    <a (click)="closeMenu()" [class.text-secondary]="isActive('home')" href="#home" class="block text-gray-700 hover:text-secondary transition">Home</a>
    <a (click)="closeMenu()" [class.text-secondary]="isActive('work')" href="#work" class="block text-gray-700 hover:text-secondary transition">Work</a>
    <a (click)="closeMenu()" [class.text-secondary]="isActive('contact')" href="#contact" class="block text-gray-700 hover:text-secondary transition">Contact</a>
  </div>
</header>
